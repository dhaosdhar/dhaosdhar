[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhaos"
version = "0.1.1"
description = "Assistant de codage agentique avec bases de savoir locales — cerveau Ollama (local) ou Claude (API), commutable"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.8",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "numpy>=1.26",
  "beautifulsoup4>=4.12",
  "ddgs>=9",
  "jsonschema>=4",
  "pypdf>=4",
  "tomli-w>=1",
]

[project.optional-dependencies]
train = ["torch>=2.2"]
finetune = ["torch>=2.2", "transformers>=4.40", "peft>=0.10", "datasets>=2.18", "accelerate>=0.28"]
embeddings = ["sentence-transformers>=2.6"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
dhaos = "dhaos.cli.main:app"

[tool.setuptools.packages.find]
include = ["dhaos*"]

[tool.setuptools.package-data]
dhaos = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
